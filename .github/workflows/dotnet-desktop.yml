name: Build & Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'schedule_example.json'
      - '.workbuddy/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      Solution_Name: 学程.sln
      Project_Name: 学程.csproj
      Project_Directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from csproj
        id: version
        run: |
          $xml = [xml](Get-Content "${{ env.Project_Name }}")
          $ver = $xml.Project.PropertyGroup.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = $xml.Project.PropertyGroup.Version }
          if ($ver -match '(\d+\.\d+\.\d+)') { $ver = $matches[1] } else { $ver = "1.6.0" }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"
        shell: pwsh

      - name: Restore
        run: dotnet restore ${{ env.Solution_Name }}

      - name: Build (Debug)
        run: dotnet build ${{ env.Solution_Name }} -c Debug --no-restore

      # ── 发布两个版本 ──
      - name: Publish (Self-contained, x64)
        run: dotnet publish ${{ env.Project_Name }} -c Release -r win-x64 --self-contained true -o publish/sc

      - name: Publish (Framework-dependent, x64)
        run: dotnet publish ${{ env.Project_Name }} -c Release -r win-x64 --self-contained false -o publish/fd

      # ── 代码签名（两个版本） ──
      - name: Import signing certificate
        if: github.event_name == 'push'
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [System.IO.File]::WriteAllBytes("${{ env.Project_Directory }}\StudyJourney.pfx", $bytes)
        shell: pwsh

      - name: Find signtool
        if: github.event_name == 'push'
        id: find_signtool
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          echo "signtool_path=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $signtool"
        shell: pwsh

      - name: Sign SC binaries
        if: github.event_name == 'push'
        run: |
          $tool = "${{ steps.find_signtool.outputs.signtool_path }}"
          & $tool sign /fd SHA256 /f "${{ env.Project_Directory }}\StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "${{ env.Project_Directory }}\publish\sc\学程.exe"
          & $tool sign /fd SHA256 /f "${{ env.Project_Directory }}\StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "${{ env.Project_Directory }}\publish\sc\学程.dll"
        shell: pwsh

      - name: Sign FD binaries
        if: github.event_name == 'push'
        run: |
          $tool = "${{ steps.find_signtool.outputs.signtool_path }}"
          & $tool sign /fd SHA256 /f "${{ env.Project_Directory }}\StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "${{ env.Project_Directory }}\publish\fd\学程.exe"
          & $tool sign /fd SHA256 /f "${{ env.Project_Directory }}\StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "${{ env.Project_Directory }}\publish\fd\学程.dll"
        shell: pwsh

      - name: Verify SC signatures
        if: github.event_name == 'push'
        run: |
          Import-PfxCertificate -FilePath "${{ env.Project_Directory }}\StudyJourney.pfx" -CertStoreLocation Cert:\LocalMachine\Root -Password (ConvertTo-SecureString -String "${{ secrets.PFX_PASSWORD }}" -AsPlainText -Force) -Exportable
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "${{ env.Project_Directory }}\publish\sc\学程.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "${{ env.Project_Directory }}\publish\sc\学程.dll"
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "${{ env.Project_Directory }}\publish\fd\学程.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "${{ env.Project_Directory }}\publish\fd\学程.dll"
        shell: pwsh

      - name: Remove from trusted root
        if: always() && github.event_name == 'push'
        run: |
          $certs = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -eq "CN=XEKernel, O=XEKernel, L=Anhui, C=CN" }
          foreach ($c in $certs) { Remove-Item $c.PSPath -Force }
        shell: pwsh

      - name: Remove certificate
        if: always() && github.event_name == 'push'
        run: Remove-Item -Path "${{ env.Project_Directory }}\StudyJourney.pfx" -Force -ErrorAction SilentlyContinue
        shell: pwsh

      # ── 打包（带版本号） ──
      - name: Pack SC zip
        run: |
          cd publish\sc
          powershell Compress-Archive -Path * -DestinationPath ..\..\StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip
        shell: pwsh

      - name: Pack FD zip
        run: |
          cd publish\fd
          powershell Compress-Archive -Path * -DestinationPath ..\..\StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd.zip
        shell: pwsh

      - name: Create Release & Upload
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: 学程 v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            ## 学程 v${{ steps.version.outputs.version }}

            **自包含版** (`-win-x64.zip`)：无需安装 .NET，直接运行。体积较大。
            **框架依赖版** (`-win-x64-fd.zip`)：需安装 [.NET 8 桌面运行时](https://dotnet.microsoft.com/download/dotnet/8.0)。体积较小。

            > 自动构建 · `${{ github.sha }}`
            > ${{ github.event.head_commit.message }}
          files: |
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SC artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64
          path: publish/sc/

      - name: Upload FD artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd
          path: publish/fd/
