name: Build & Release (Avalonia)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'schedule_example.json'
      - '.workbuddy/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      Project_Path: StudyJourney.Avalonia/StudyJourney.Avalonia.csproj
      Updater_Path: Updater/StudyJourney.Updater.csproj
      # ── 形态过渡开关（2026-10-01，用完就改回 false）────────────────────────
      # true = 兼容包（`-win-x64-fd.zip`）里也放 **AOT 构建**，而不是真正的框架依赖构建。
      #
      # 为什么要这么做：v3.0.0 的形态判定只按「有没有 coreclr.dll」二分 → **AOT 版没有该文件，
      # 被判成「框架依赖」** → 已经升到 v3.0.0 的机器**下一次更新会来下 `-fd.zip`**。
      # 那些机器跑的是**旧判定代码**、本机改不了；如果这里的 `-fd.zip` 放真·框架依赖构建，
      # 它们更新完就需要机器上装 .NET（教室机通常没有）→ 打不开。
      # AOT 构建在**任何 win-x64** 上都能跑（免 .NET），所以过渡期拿它当兼容包：
      # 旧机器误挑到它也能正常用，而且升上来之后就带上修好的判定代码，之后一切正常。
      #
      # 什么时候能关：等所有在用的机器都跑过一次「含三态形态判定」的版本（v3.0.1 起）之后，
      # 把这里改成 false 即恢复为真正的框架依赖包。
      FD_ASSET_IS_AOT_ALIAS: 'true'

      # ── 必经门槛版本（2026-10-01 用户要求）────────────────────────────────
      # 非空 = 兼容包 `-win-x64-fd.zip` 里放的是**这个版本的推荐包**（而不是本版的构建）。
      #
      # 为什么这样就能"强制老版本先升到门槛版本"：会去下 `-fd.zip` 的只有两类机器 ——
      #   ① v3.0.0 的 AOT 机器（旧判定代码把 AOT 误判成框架依赖）
      #   ② 框架依赖机器
      # 让这个资产固定成门槛版本的构建，它们就只能先装成门槛版本；装好之后跑的是**门槛版本的
      # 新代码**，形态判定正确 → 下一次自动检查就会拿到最新版。于是"老 → 门槛 → 最新"，
      # 不会出现"老代码自己决定装什么"（那正是 v3.0.0 挑到需要装 .NET 的包的原因）。
      #
      # ⚠ 与主程序里的 `UpdateService.UpgradeWaypointVersion` 是**同一件事的两端，改一边要同步**。
      # ⚠ 走推荐包（非 -fd）的机器（自包含 / 已升级过的机器）不受此限制、直接拿本版 ——
      #   本版本身已含全部修复，结果等价（客户端那端只对跑新代码的机器生效）。
      # ⚠ 取消门槛：把这里清空即可（清空后回到 FD_ASSET_IS_AOT_ALIAS 的别名行为）。
      UPGRADE_WAYPOINT: '3.0.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 读取版本号（支持 2.0.0-beta 这种预发布格式），并判断是否 prerelease
      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "${{ env.Project_Path }}")
          $ver = [string]$xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "2.0.0-beta" }
          $ver = $ver.Trim()
          $isPre = $ver -match '(alpha|beta|rc|pre)'
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "prerelease=$isPre" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver (prerelease: $isPre)"

      # 这个版本是否**已经发过**（tag 已存在）。
      # ⚠ 2026-09-25 发现的问题：Release 正文原来是 `${{ github.event.head_commit.message }}`，
      #    而 action-gh-release 在 tag 已存在时会**更新**那个 Release（含正文与资产）→
      #    每次普通提交（如改文档/改设置页）跑 CI 都会把上一个版本的 Release 正文改写成
      #    本次提交的整段说明 —— 既覆盖了原正文，又让 Release 页面变成一屏读不完的长文。
      #    现在：非发版提交只构建、不发布（构建本身仍有价值：验证能不能编过）。
      - name: Check if this version is already released
        if: github.event_name == 'push'
        id: tagcheck
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $found = git ls-remote --tags origin "refs/tags/$tag"
          $exists = -not [string]::IsNullOrWhiteSpace($found)
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "tag ${tag} 已存在: $exists（true = 本次不是发版提交，跳过发布）"

      - name: Restore
        run: dotnet restore ${{ env.Project_Path }}

      - name: Build (Debug)
        run: dotnet build ${{ env.Project_Path }} -c Debug --no-restore

      # ── 发布主应用（2026-10-01 起：NativeAOT 主推 + 框架依赖兜底） ──
      # 本机实测对比：AOT = 8 文件 / 解压 69.4MB / **zip 28.0MB** / 启动 ~1.7s / 免装 .NET；
      # 旧自包含包 zip 86.8MB；旧框架依赖包 zip 40.7MB（需装 .NET）、启动 ~3.0s。
      # 结论：**AOT 取代原先的「自包含」包**（更小更快、同样免 .NET），只留框架依赖版兜底。
      - name: Publish (NativeAOT, x64)
        run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 -p:PublishAot=true -o publish/aot

      - name: Publish (Framework-dependent, x64)
        run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained false -o publish/fd

      - name: Publish Updater (NativeAOT)
        run: dotnet publish ${{ env.Updater_Path }} -c Release -r win-x64 -p:PublishAot=true -o publish/updater-aot

      - name: Publish Updater (Framework-dependent)
        run: dotnet publish ${{ env.Updater_Path }} -c Release -r win-x64 --self-contained false -o publish/updater-fd

      - name: Copy Updater to both outputs
        shell: pwsh
        run: |
          Copy-Item -Path publish\updater-aot\* -Destination publish\aot\ -Recurse -Force
          Copy-Item -Path publish\updater-fd\* -Destination publish\fd\ -Recurse -Force

      # ⚠ 删掉调试符号（.pdb）—— 位置很关键，必须在**签名与生成清单之前**：
      #   AOT 的 pdb 极大（主程序 191MB + libSkiaSharp 84MB + libHarfBuzzSharp 20MB ≈ 295MB，
      #   是程序本体体积的 6 倍），而教室机根本用不到。
      #   若放在"生成清单"之后删，清单会列出这些文件 → 更新器按清单核对时找不到 → 清理逻辑每次都报失败。
      - name: Strip debug symbols (AOT)
        shell: pwsh
        run: |
          $pdbs = Get-ChildItem -Path publish\aot -Recurse -Filter *.pdb
          if ($pdbs) { $pdbs | Remove-Item -Force }
          Write-Host "AOT 目录已移除 $($pdbs.Count) 个 pdb"

      # ── 代码签名（自签名证书 CN=XEKernel，来自 GitHub Secrets） ──
      - name: Import signing certificate
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [System.IO.File]::WriteAllBytes("StudyJourney.pfx", $bytes)

      - name: Find signtool
        if: github.event_name == 'push'
        id: find_signtool
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          echo "signtool_path=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $signtool"

      # ⚠ AOT 产物只有一个 exe（**没有** StudyJourneyAvalonia.dll），签名脚本不能照抄旧版。
      # ⚠ 顺带修掉一个既有缺陷：更新器 StudyJourney.Updater.exe 原来**从未被签名**
      #   —— 而它要在用户机上执行"删除+替换程序文件"，未签名更容易被杀软拦下或触发 UAC 疑问。
      #   两个形态都补上，并且先判断文件存在（fd 形态没有 AOT 那套单 exe 结构）。
      - name: Sign binaries (NativeAOT)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $st = "${{ steps.find_signtool.outputs.signtool_path }}"
          $pfx = "StudyJourney.pfx"
          $pw = "${{ secrets.PFX_PASSWORD }}"
          foreach ($f in @("publish\aot\StudyJourneyAvalonia.exe", "publish\aot\StudyJourney.Updater.exe")) {
            if (Test-Path $f) {
              & $st sign /fd SHA256 /f $pfx /p $pw /tr http://timestamp.digicert.com /td SHA256 /v $f
            } else { Write-Host "跳过（不存在）：$f" }
          }

      - name: Sign binaries (Framework-dependent)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $st = "${{ steps.find_signtool.outputs.signtool_path }}"
          $pfx = "StudyJourney.pfx"
          $pw = "${{ secrets.PFX_PASSWORD }}"
          foreach ($f in @("publish\fd\StudyJourneyAvalonia.exe", "publish\fd\StudyJourneyAvalonia.dll", "publish\fd\StudyJourney.Updater.exe")) {
            if (Test-Path $f) {
              & $st sign /fd SHA256 /f $pfx /p $pw /tr http://timestamp.digicert.com /td SHA256 /v $f
            } else { Write-Host "跳过（不存在）：$f" }
          }

      - name: Verify signatures
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # 自签名证书：先导入受信根再 verify /pa（/pa 用默认认证验证策略）
          Import-PfxCertificate -FilePath "StudyJourney.pfx" -CertStoreLocation Cert:\LocalMachine\Root -Password (ConvertTo-SecureString -String "${{ secrets.PFX_PASSWORD }}" -AsPlainText -Force) -Exportable
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "publish\aot\StudyJourneyAvalonia.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "publish\fd\StudyJourneyAvalonia.exe"
          Write-Host "签名验证通过（CN=XEKernel）"

      - name: Remove from trusted root
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $certs = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*XEKernel*" }
          foreach ($c in $certs) { Remove-Item $c.PSPath -Force -ErrorAction SilentlyContinue }

      - name: Remove certificate
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: Remove-Item -Path "StudyJourney.pfx" -Force -ErrorAction SilentlyContinue

      # ── 生成安装清单（供更新器差分清理旧文件） ──
      # 2026-09-24 新增：更新一直是"只覆盖、不删除"，旧版本独有的文件会永远留在程序目录里。
      # 清单列出包内所有文件的相对路径（正斜杠、排序、UTF-8 无 BOM），更新器拿它和
      # 目标目录里上一次安装的清单做差分 → 只删"我们装进去过、这次不再有了"的文件。
      # ⚠ 必须在签名定稿之后、打包之前生成，确保清单与实际入包内容逐字一致。
      - name: Generate install manifest
        shell: pwsh
        run: |
          foreach ($d in @('publish\aot', 'publish\fd')) {
            $root = (Resolve-Path $d).Path
            $len  = $root.Length + 1
            $list = Get-ChildItem -Path $root -Recurse -File |
                      ForEach-Object { $_.FullName.Substring($len).Replace('\', '/') } |
                      Sort-Object
            # ⚠ 阈值不能沿用旧的 10：**NativeAOT 形态只有 8 个文件**
            #   （单 exe + 5 个原生库 + LICENSE + 更新器），用 10 会让 AOT 打包直接抛异常中断。
            #   AOT 包本来就是"文件少"的形态，这正是它的优点 —— 门槛降到 5 仍能拦住
            #   "清单为空/几乎为空"这种真异常。
            if ($list.Count -lt 5) { throw "$d 文件数异常（$($list.Count)），清单不生成" }
            $out = Join-Path $root 'install-manifest.txt'
            # 显式用无 BOM 的 UTF8（更新器按行读，BOM 会污染第一行）
            [System.IO.File]::WriteAllLines($out, [string[]]$list, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "$d → 清单写入 $($list.Count) 个文件"
          }

      # ── 打包（带版本号） ──
      - name: Pack AOT zip
        shell: pwsh
        run: |
          cd publish\aot
          powershell Compress-Archive -Path * -DestinationPath ..\..\StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip

      - name: Pack FD zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cur = "${{ steps.version.outputs.version }}"
          $out = "StudyJourney-v$cur-win-x64-fd.zip"
          $wp  = $env:UPGRADE_WAYPOINT

          if ($wp -and $wp -ne $cur) {
            # ── 门槛期：兼容包 = 门槛版本的推荐包（让老机器必须先装成门槛版本）──
            # 取不到就**回退**到别名方案（AOT 构建）：宁可这版不设门槛，也不能打包失败或发错包。
            try {
              gh release download "v$wp" -p "*-win-x64.zip" -D publish\waypoint --clobber
              $a = Get-ChildItem publish\waypoint\*.zip -ErrorAction Stop | Select-Object -First 1
              if (-not $a) { throw "没下到 v$wp 的推荐包" }
              Copy-Item $a.FullName $out -Force
              Write-Host "兼容包 = 门槛版本 v$wp 的推荐包（$($a.Name)）→ $out"
            } catch {
              Write-Host "⚠ 取门槛版本 v$wp 失败（$_）→ 回退到 AOT 别名方案"
              Push-Location publish\aot
              powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath '$PWD\..\..\$out' -Force"
              Pop-Location
            }
          }
          elseif ($env:FD_ASSET_IS_AOT_ALIAS -eq 'true') {
            # 过渡期：兼容包也放 AOT 构建（见 env 里的开关说明）
            Push-Location publish\aot
            powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath '$PWD\..\..\$out' -Force"
            Pop-Location
          }
          else {
            Push-Location publish\fd
            powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath '$PWD\..\..\$out' -Force"
            Pop-Location
          }
          if (Test-Path $out) { Write-Host "已生成 $out（$([math]::Round((Get-Item $out).Length/1MB,1)) MB）" }
          else { throw "$out 没有生成" }

      # ── 生成 Release 正文：只取提交说明里的 <!--RELEASE--> 块 ──
      # 约定（2026-09-25）：提交说明可以写长篇（背景 / 原因 / 踩坑 / 验证），
      # **Release 正文只放面向使用者的两份清单：更新了什么、修了什么**，其它一律不要。
      # 所以正文从标记块里提取；**没写标记就只取标题行**，绝不把整段提交说明贴上去
      # （那正是以前 Release 页面一屏读不完的原因）。
      - name: Prepare release notes
        if: github.event_name == 'push'
        id: notes
        shell: pwsh
        run: |
          # ⚠ 坑（2026-09-25 实际踩到）：原生命令（git）的**多行输出在 PowerShell 里是字符串数组**，
          #    而数组上的 -match 是"过滤"语义 —— 判定为真但**不会给 $Matches 赋值** →
          #    下一行 $Matches[1] 报 "Cannot index into a null array"。必须 -join 拼成单个字符串。
          $msg = (git log -1 --pretty=%B) -join "`n"
          if ($msg -match '(?s)<!--RELEASE-->(.*?)<!--/RELEASE-->') {
            $body = $Matches[1].Trim()
          } else {
            $body = ($msg -split "`r?`n")[0].Trim()   # 兜底：只取标题行
          }
          if ([string]::IsNullOrWhiteSpace($body)) { $body = "维护更新" }

          # 追加「下载哪个版本」说明。
          # 放在标记块**之后**：标记块只写"更新了什么、修了什么"，这段下载说明由 CI 统一补，
          # 免得每次手写漏掉、也免得各版本措辞不一致。
          # 2026-10-01 改版：主推包从「自包含」换成 **NativeAOT**（免装 .NET 且体积从 86.8MB 降到 28MB、
          #   启动从 ~3.0s 降到 ~1.7s），框架依赖版保留作兜底。**不要再让老师在"自包含"里选**
          #   —— 那个包已被 AOT 完全取代，留着只会多一个更差的选项。
          # ⚠ 此处不写体积 —— 正文生成时资产还没上传，GitHub Release 页面本身会显示每个文件的大小。
          # ⚠ .NET 10 是 Avalonia 版本的运行时（v1.x 的 WPF 版是 .NET 8，这里不再区分）。
          $ver = "${{ steps.version.outputs.version }}"
          $wp2 = $env:UPGRADE_WAYPOINT
          if ($wp2 -and $wp2 -ne $ver) {
            # 门槛期措辞：兼容包是"给旧版本程序用的中间版本包"，老师自己也用不到
            $body += "`n`n### 下载哪个版本`n- **直接下 ``StudyJourney-v$ver-win-x64.zip``**（免安装 .NET、解压即用、体积小启动快）。`n- 另一个 ``…-win-x64-fd.zip``：**给旧版本程序自动升级用的中间版本包**（内容为 v$wp2），你不需要用它。`n`n> 比 v$wp2 更旧的版本会被要求**先升级到 v$wp2**，之后自动升级到本版。`n"
          } elseif ($env:FD_ASSET_IS_AOT_ALIAS -eq 'true') {
            # 过渡期措辞：两个包内容相同，别让老师以为自己要挑（见 env 里的开关说明）
            $body += "`n`n### 下载哪个版本`n- **直接下 ``StudyJourney-v$ver-win-x64.zip``**（免安装 .NET、解压即用、体积小启动快）。`n- 另一个 ``…-win-x64-fd.zip``：**内容与它完全相同** —— 本版为过渡版本，保留这个名字只是为了让**旧版本的程序**在自动更新时能正确识别，你不需要用它。`n"
          } else {
            $body += "`n`n### 下载哪个版本`n- **推荐**（``StudyJourney-v$ver-win-x64.zip``）：免安装 .NET，解压即用，体积小、启动快。`n- **兼容版**（``StudyJourney-v$ver-win-x64-fd.zip``）：需安装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0)。仅当推荐版在你的电脑上打不开时再换这个。`n"
          }

          [System.IO.File]::WriteAllText("release-notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "—— 发布正文 ——"
          Write-Host $body

      - name: Create Release & Upload
        if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: 学程 v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AOT artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64
          path: publish/aot/

      - name: Upload FD artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd
          path: publish/fd/
