name: Build & Release (Avalonia)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'schedule_example.json'
      - '.workbuddy/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      Project_Path: StudyJourney.Avalonia/StudyJourney.Avalonia.csproj
      Updater_Path: Updater/StudyJourney.Updater.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 读取版本号（支持 2.0.0-beta 这种预发布格式），并判断是否 prerelease
      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "${{ env.Project_Path }}")
          $ver = [string]$xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "2.0.0-beta" }
          $ver = $ver.Trim()
          $isPre = $ver -match '(alpha|beta|rc|pre)'
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "prerelease=$isPre" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver (prerelease: $isPre)"

      # 这个版本是否**已经发过**（tag 已存在）。
      # ⚠ 2026-09-25 发现的问题：Release 正文原来是 `${{ github.event.head_commit.message }}`，
      #    而 action-gh-release 在 tag 已存在时会**更新**那个 Release（含正文与资产）→
      #    每次普通提交（如改文档/改设置页）跑 CI 都会把上一个版本的 Release 正文改写成
      #    本次提交的整段说明 —— 既覆盖了原正文，又让 Release 页面变成一屏读不完的长文。
      #    现在：非发版提交只构建、不发布（构建本身仍有价值：验证能不能编过）。
      - name: Check if this version is already released
        if: github.event_name == 'push'
        id: tagcheck
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $found = git ls-remote --tags origin "refs/tags/$tag"
          $exists = -not [string]::IsNullOrWhiteSpace($found)
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "tag ${tag} 已存在: $exists（true = 本次不是发版提交，跳过发布）"

      - name: Restore
        run: dotnet restore ${{ env.Project_Path }}

      - name: Build (Debug)
        run: dotnet build ${{ env.Project_Path }} -c Debug --no-restore

      # ── 发布主应用（自包含 + 框架依赖） ──
      - name: Publish (Self-contained, x64)
        run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained true -o publish/sc

      - name: Publish (Framework-dependent, x64)
        run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained false -o publish/fd

      - name: Publish Updater (Self-contained)
        run: dotnet publish ${{ env.Updater_Path }} -c Release -r win-x64 --self-contained true -o publish/updater-sc

      - name: Publish Updater (Framework-dependent)
        run: dotnet publish ${{ env.Updater_Path }} -c Release -r win-x64 --self-contained false -o publish/updater-fd

      - name: Copy Updater to both outputs
        shell: pwsh
        run: |
          Copy-Item -Path publish\updater-sc\* -Destination publish\sc\ -Recurse -Force
          Copy-Item -Path publish\updater-fd\* -Destination publish\fd\ -Recurse -Force

      # ── 代码签名（自签名证书 CN=XEKernel，来自 GitHub Secrets） ──
      - name: Import signing certificate
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [System.IO.File]::WriteAllBytes("StudyJourney.pfx", $bytes)

      - name: Find signtool
        if: github.event_name == 'push'
        id: find_signtool
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          echo "signtool_path=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $signtool"

      - name: Sign binaries (Self-contained)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "${{ steps.find_signtool.outputs.signtool_path }}" sign /fd SHA256 /f "StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "publish\sc\StudyJourneyAvalonia.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" sign /fd SHA256 /f "StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "publish\sc\StudyJourneyAvalonia.dll"

      - name: Sign binaries (Framework-dependent)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "${{ steps.find_signtool.outputs.signtool_path }}" sign /fd SHA256 /f "StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "publish\fd\StudyJourneyAvalonia.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" sign /fd SHA256 /f "StudyJourney.pfx" /p "${{ secrets.PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /v "publish\fd\StudyJourneyAvalonia.dll"

      - name: Verify signatures
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # 自签名证书：先导入受信根再 verify /pa（/pa 用默认认证验证策略）
          Import-PfxCertificate -FilePath "StudyJourney.pfx" -CertStoreLocation Cert:\LocalMachine\Root -Password (ConvertTo-SecureString -String "${{ secrets.PFX_PASSWORD }}" -AsPlainText -Force) -Exportable
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "publish\sc\StudyJourneyAvalonia.exe"
          & "${{ steps.find_signtool.outputs.signtool_path }}" verify /pa /v "publish\fd\StudyJourneyAvalonia.exe"
          Write-Host "签名验证通过（CN=XEKernel）"

      - name: Remove from trusted root
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $certs = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*XEKernel*" }
          foreach ($c in $certs) { Remove-Item $c.PSPath -Force -ErrorAction SilentlyContinue }

      - name: Remove certificate
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: Remove-Item -Path "StudyJourney.pfx" -Force -ErrorAction SilentlyContinue

      # ── 生成安装清单（供更新器差分清理旧文件） ──
      # 2026-09-24 新增：更新一直是"只覆盖、不删除"，旧版本独有的文件会永远留在程序目录里。
      # 清单列出包内所有文件的相对路径（正斜杠、排序、UTF-8 无 BOM），更新器拿它和
      # 目标目录里上一次安装的清单做差分 → 只删"我们装进去过、这次不再有了"的文件。
      # ⚠ 必须在签名定稿之后、打包之前生成，确保清单与实际入包内容逐字一致。
      - name: Generate install manifest
        shell: pwsh
        run: |
          foreach ($d in @('publish\sc', 'publish\fd')) {
            $root = (Resolve-Path $d).Path
            $len  = $root.Length + 1
            $list = Get-ChildItem -Path $root -Recurse -File |
                      ForEach-Object { $_.FullName.Substring($len).Replace('\', '/') } |
                      Sort-Object
            if ($list.Count -lt 10) { throw "$d 文件数异常（$($list.Count)），清单不生成" }
            $out = Join-Path $root 'install-manifest.txt'
            # 显式用无 BOM 的 UTF8（更新器按行读，BOM 会污染第一行）
            [System.IO.File]::WriteAllLines($out, [string[]]$list, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "$d → 清单写入 $($list.Count) 个文件"
          }

      # ── 打包（带版本号） ──
      - name: Pack SC zip
        shell: pwsh
        run: |
          cd publish\sc
          powershell Compress-Archive -Path * -DestinationPath ..\..\StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip

      - name: Pack FD zip
        shell: pwsh
        run: |
          cd publish\fd
          powershell Compress-Archive -Path * -DestinationPath ..\..\StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd.zip

      # ── 生成 Release 正文：只取提交说明里的 <!--RELEASE--> 块 ──
      # 约定（2026-09-25）：提交说明可以写长篇（背景 / 原因 / 踩坑 / 验证），
      # **Release 正文只放面向使用者的两份清单：更新了什么、修了什么**，其它一律不要。
      # 所以正文从标记块里提取；**没写标记就只取标题行**，绝不把整段提交说明贴上去
      # （那正是以前 Release 页面一屏读不完的原因）。
      - name: Prepare release notes
        if: github.event_name == 'push'
        id: notes
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=%B
          if ($msg -match '(?s)<!--RELEASE-->(.*?)<!--/RELEASE-->') {
            $body = $Matches[1].Trim()
          } else {
            $body = ($msg -split "`r?`n")[0].Trim()   # 兜底：只取标题行
          }
          if ([string]::IsNullOrWhiteSpace($body)) { $body = "维护更新" }
          [System.IO.File]::WriteAllText("release-notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "—— 发布正文 ——"
          Write-Host $body

      - name: Create Release & Upload
        if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: 学程 v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64.zip
            StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SC artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64
          path: publish/sc/

      - name: Upload FD artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: StudyJourney-v${{ steps.version.outputs.version }}-win-x64-fd
          path: publish/fd/
